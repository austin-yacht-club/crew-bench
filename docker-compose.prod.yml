# Production overlay. Use with the shared base:
#   ./scripts/compose.sh prod up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Runs as its own Compose project (crew-bench-prod) with its own named volumes,
# database and host ports, so the debug stack can run side by side untouched.
#
# Override any port or the database name from the environment file, e.g.
#   PROD_FRONTEND_PORT=8080 in .env / .env.prod
name: crew-bench-prod

services:
  db:
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-crewbench}
    ports:
      - "${PROD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewbench} -d ${PROD_POSTGRES_DB:-crewbench}"]
    restart: unless-stopped

  backend:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewbench}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Copy .env.example to .env and run ./scripts/generate_secrets.sh}@db:5432/${PROD_POSTGRES_DB:-crewbench}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PROD_BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    ports:
      - "${PROD_FRONTEND_PORT:-3333}:80"
    restart: unless-stopped

volumes:
  db_data:
    name: crew-bench-prod-db-data
  backend_logs:
    name: crew-bench-prod-backend-logs
