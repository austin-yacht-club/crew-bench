# Shared base definition for Crew Bench. This file is not meant to be run on
# its own: it publishes no host ports and names no project, so pair it with
# exactly one environment overlay.
#
#   ./scripts/compose.sh prod up -d --build   # production stack
#   ./scripts/compose.sh dev  up -d --build   # debug/development stack
#
# Equivalent long form:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  up -d --build
#
# All persistent state lives in named Docker volumes (no host bind mounts), so
# the two stacks never share data and neither writes into the working tree.
#
# Secrets come from an environment file (.env, or .env.prod / .env.dev when
# present). Compose refuses to start if required secrets are missing or empty.
# Copy .env.example to .env and run ./scripts/generate_secrets.sh first.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crewbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Copy .env.example to .env and run ./scripts/generate_secrets.sh}
      POSTGRES_DB: ${POSTGRES_DB:-crewbench}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crewbench} -d ${POSTGRES_DB:-crewbench}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql://${POSTGRES_USER:-crewbench}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set. Copy .env.example to .env and run ./scripts/generate_secrets.sh}@db:5432/${POSTGRES_DB:-crewbench}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set. Copy .env.example to .env and run ./scripts/generate_secrets.sh}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set. Copy .env.example to .env and run ./scripts/generate_secrets.sh}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Leave empty. Do not set to /api — that 404s all API routes on FastAPI 0.109+.
      ROOT_PATH: ${ROOT_PATH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Point LOG_FILE at /var/log/crewbench/... to keep logs in the named volume.
      LOG_FILE: ${LOG_FILE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_logs:/var/log/crewbench

  frontend:
    build:
      context: ./frontend
      args:
        # Prefer runtime API_BASE_PATH (no rebuild). Build args are fallbacks only.
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_RECAPTCHA_SITE_KEY: ${REACT_APP_RECAPTCHA_SITE_KEY:-}
    environment:
      # Browser API base path — change without rebuilding the frontend image.
      #   /api       default (recommended)
      #   /api/api   only if the outer reverse proxy strips one /api before the backend
      API_BASE_PATH: ${API_BASE_PATH:-/api}
    depends_on:
      - backend

volumes:
  db_data:
  backend_logs:
